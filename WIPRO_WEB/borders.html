<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders</title>
    <style>
        .solid-border {
         border: 2px solid black;
         padding: 10px;
         margin: 10px;
         }

         .dashed-border {
          border: 2px dashed green;
          padding: 10px;
          margin: 10px;
    }
        .dotted-border {
         border: 2px dotted blue;
         padding: 10px;
         margin: 10px;
    
        }
        .double-border {
        border: 4px double red;
        padding: 10px;
        margin: 10px;
     } 
      
       .groove-border {
       border: 4px groove purple;
       padding: 10px;
       margin: 10px;
}
      .ridge-border {
       border: 4px ridge orange;
       padding: 10px;
       margin: 10px;
}

       .inset-border {
        border: 4px inset brown;
        padding: 10px;
        margin: 10px;
}
   </style>
</head>
<body>
    <div class="solid-border">Solid Border</div>
    <div class="dashed-border">Dashed Border</div>
    <div class="dotted-border">Dotted Border</div>
    <div class="double-border">Double Border</div>
    <div class="groove-border">Groove Border</div>
    <div class="ridge-border">Ridge Border</div>
    <div class="inset-border">Inset Border</div>


</body>
</html>
