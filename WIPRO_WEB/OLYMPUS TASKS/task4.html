<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: #333;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 1.4em;
    }

    /* Footer */
    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: auto;
      font-size: 0.9em;
    }

    .container {
      background: #fff;
      margin: 20px auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 600px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    button {
      background: #4CAF50;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 10px 0;
    }
    button:hover {
      background: #45a049;
    }
    form {
      display: none;
      margin-top: 15px;
    }
    form input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .contact-list {
      margin-top: 20px;
    }
    .contact-card {
      background: #f9f9f9;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
    }
    .contact-card h3 {
      margin: 0;
      color: #333;
    }
    .contact-card p {
      margin: 5px 0;
      color: #555;
    }
    @media (max-width: 600px) {
      .container {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    📒 Contact Manager Application
  </header>

  <!-- Main Content -->
  <div class="container">
    <h1>Welcome to Contact Manager</h1>
    <button id="addContactBtn">Add Contact</button>

    <form id="contactForm">
      <input type="text" id="name" placeholder="Enter Name" required>
      <input type="email" id="email" placeholder="Enter Email" required>
      <input type="tel" id="phone" placeholder="Enter Phone Number" required>
      <button type="submit">Save Contact</button>
    </form>

    <div class="contact-list" id="contactList">
      <h2>My Contacts</h2>
      <!-- Contacts will appear here -->
    </div>
  </div>

  <!-- Footer -->
  <footer>
    &copy; 2025 Contact Manager | Designed by Anusha 🚀
  </footer>

  <script>
    const addContactBtn = document.getElementById("addContactBtn");
    const contactForm = document.getElementById("contactForm");
    const contactList = document.getElementById("contactList");

    let contacts = []; // store contacts in memory

    // Show/Hide contact form
    addContactBtn.addEventListener("click", () => {
      contactForm.style.display = 
        contactForm.style.display === "block" ? "none" : "block";
    });

    // Handle form submission
    contactForm.addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const phone = document.getElementById("phone").value;

      const newContact = { name, email, phone };
      contacts.push(newContact);

      displayContacts();
      contactForm.reset();
      contactForm.style.display = "none";
    });

    // Display contacts
    function displayContacts() {
      contactList.innerHTML = "<h2>My Contacts</h2>";
      contacts.forEach((c) => {
        const card = document.createElement("div");
        card.classList.add("contact-card");
        card.innerHTML = `
          <h3>${c.name}</h3>
          <p>Email: ${c.email}</p>
          <p>Phone: ${c.phone}</p>
        `;
        contactList.appendChild(card);
      });
    }
  </script>
</body>
</html>
