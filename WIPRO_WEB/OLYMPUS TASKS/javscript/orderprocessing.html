<!-- create a simple javascript program for order processing

 

1. Stores menu items with prices (data types : strings , numbers , array and objects).

2. Take a customer's order (conditional statement)

3. Calculates the total price with discounts if applicable(operators)

4. Loops through orders to display them 

-->
<!DOCTYPE html>
<html>
<head>
    <title>Order Processing</title>
</head>
<body>
    <h1>Simple Order Processing</h1>
    <script>
        // 1) Store menu items with prices
        let menu = [
            { name: "Coffee", price: 50 },
            { name: "Tea", price: 30 },
            { name: "Sandwich", price: 80 },
            { name: "Cake", price: 100 }
        ];

        // Show menu
        console.log("Menu:");
        for (let i = 0; i < menu.length; i++) {
            console.log(menu[i].name + " - ₹" + menu[i].price);
        }

        // 2) Take customer order (multiple items)
        let orders = [];
        let moreOrders = true;

        while (moreOrders) {
            let customerOrder = prompt("Enter an item (Coffee/Tea/Sandwich/Cake) or type 'done' to finish:");

            if (customerOrder.toLowerCase() === "done") {
                moreOrders = false;
                break;
            }

            // Check if item exists
            let found = false;
            for (let i = 0; i < menu.length; i++) {
                if (menu[i].name.toLowerCase() === customerOrder.toLowerCase()) {
                    orders.push(menu[i]);
                    found = true;
                    break;
                }
            }

            if (!found) {
                console.log("Sorry, we don't have that item.");
            }
        }

        // If orders exist, process them
        if (orders.length > 0) {
            // 3) Calculate total price
            let total = 0;
            for (let i = 0; i < orders.length; i++) {
                total += orders[i].price;
            }

            // Apply discount if 3 or more items ordered
            let discount = 0;
            if (orders.length >= 3) {
                discount = total * 0.1; // 10% discount
                total -= discount;
            }

            // 4) Display order summary
            console.log("\nYour Order:");
            for (let i = 0; i < orders.length; i++) {
                console.log(orders[i].name + " - ₹" + orders[i].price);
            }

            console.log("Discount: ₹" + discount.toFixed(2));
            console.log("Total Price: ₹" + total.toFixed(2));
        } else {
            console.log("No items ordered.");
        }
    </script>
</body>
</html>
