<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report Card & Utilities</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="student.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header text-center py-3">
        <h2>📘 Student Report Card System</h2>
        <p id="timer" class="fw-bold"></p>
    </header>

    <!-- MAIN CONTENT -->
    <div class="container mt-5">

        <!-- Report Card -->
        <h1 class="text-center mb-4">Generate Your Report Card</h1>
        <div class="card shadow p-4 mb-5">
            <form id="reportForm">
                <div class="mb-3">
                    <label class="form-label">Enter Marks (comma separated)</label>
                    <input type="text" class="form-control" id="marksInput" placeholder="85, 90, 78, 88, 95">
                </div>
                <button type="submit" class="btn btn-primary">Generate Report</button>
            </form>
        </div>
        <div id="result" class="mb-5"></div>

        <!-- To-Do List -->
        <h2 class="text-center mb-4">📝 To-Do List</h2>
        <div class="card shadow p-4 mb-5">
            <div class="mb-3 d-flex">
                <input type="text" id="taskInput" class="form-control me-2" placeholder="Enter task">
                <button id="addTaskBtn" class="btn btn-success">Add Task</button>
            </div>
            <ul id="taskList" class="list-group"></ul>
        </div>

        <!-- Calculator -->
        <h2 class="text-center mb-4">🧮 Simple Calculator</h2>
        <div class="card shadow p-4">
            <div class="mb-3">
                <input type="number" id="num1" class="form-control mb-2" placeholder="Enter first number">
                <input type="number" id="num2" class="form-control mb-2" placeholder="Enter second number">
                <select id="operation" class="form-select mb-2">
                    <option value="+">Addition (+)</option>
                    <option value="-">Subtraction (-)</option>
                    <option value="*">Multiplication (*)</option>
                </select>
                <button id="calcBtn" class="btn btn-primary">Calculate</button>
            </div>
            <p id="calcResult" class="fw-bold"></p>
        </div>

    </div>

    <!-- FOOTER -->
    <footer class="footer text-center py-3 mt-5">
        <p>&copy; 2025 Student Report Card System | Designed by Anusha</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="student.js"></script>
</body>
</html>
