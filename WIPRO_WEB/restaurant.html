<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Menu Management</title>
<link rel="stylesheet" href="restaurant.css">
</head>
<body>

<h1>Restaurant Menu Management</h1>

<form id="menuForm">
    <input type="hidden" id="editIndex">
    <label>Item Name:</label>
    <input type="text" id="itemName" required>
    
    <label>Description:</label>
    <textarea id="itemDescription" required></textarea>
    
    <label>Category:</label>
    <input type="text" id="itemCategory" required>
    
    <label>Price:</label>
    <input type="number" id="itemPrice" min="0" required>
    
    <label>Availability:</label>
    <select id="itemAvailability" required>
        <option value="Available">Available</option>
        <option value="Unavailable">Unavailable</option>
    </select>
    
    <button type="submit">Save Item</button>
</form>

<table>
    <thead>
        <tr>
            <th>Item Name</th>
            <th>Description</th>
            <th>Category</th>
            <th>Price</th>
            <th>Availability</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="menuTableBody"></tbody>
</table>

<script src="restaurant.js"></script>
</body>
</html>
