<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <link rel="stylesheet" href="form.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <h2>LOGIN</h2>
      <form>
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input type="email" placeholder="Email" required>
        </div>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" placeholder="Password" required>
        </div>

        <div class="remember-section">
          <input type="checkbox" id="remember">
          <label for="remember">Remember me</label>
        </div>

        <button type="submit" class="login-btn">LOGIN</button>

        <div class="or-divider">Or login with</div>

        <div class="social-login">
          <button class="facebook-btn"><i class="fab fa-facebook-f"></i> Facebook</button>
          <button class="google-btn"><i class="fab fa-google"></i> Google</button>
        </div>

        <p class="signup-link">Not a member? <a href="signup.html">Sign up now</a></p>
      </form>
    </div>
  </div>
</body>
</html>
